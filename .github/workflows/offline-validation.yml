name: Offline validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Restore dependencies from the repository-approved feed
        run: npm ci --ignore-scripts --no-audit --fund=false
      - name: Run offline validation, including packed consumer
        run: npm run validate
      - name: Require unchanged tracked files
        run: git diff --exit-code
